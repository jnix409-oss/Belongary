[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- Redirects: removed routes → homepage ---

[[redirects]]
  from = "/company/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/directory/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/directory"
  to = "/"
  status = 301
  force = true

# --- Branch-deploy protection: prevent indexing of non-production deploys ---

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"
